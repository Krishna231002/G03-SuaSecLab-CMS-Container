
apiVersion: v1
kind: Pod
metadata:
  name: cms-restore
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: restore
      image: docker.io/library/suasploitable-cms:integrated
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: db
          mountPath: /restore/db
        - name: wp
          mountPath: /restore/wp
        - name: mail
          mountPath: /restore/mail
        - name: tls
          mountPath: /restore/tls
  volumes:
    - name: db
      persistentVolumeClaim:
        claimName: cms-db
    - name: wp
      persistentVolumeClaim:
        claimName: cms-wp
    - name: mail
      persistentVolumeClaim:
        claimName: cms-mail
    - name: tls
      persistentVolumeClaim:
        claimName: cms-tls
